  parking-lander boilerplate, not provider-published documents, and are deliberately NOT wired
  as pointers. The last live archived snapshot of the real site is 2026-06-08. mygreyter.com,
  the customer portal, still resolves through Cloudflare but its origin is dead (HTTP 526).'
