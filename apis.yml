aid: greyter
name: Greyter
description: Greyter Water Systems Inc. was an Ontario, Canada manufacturer of onsite greywater
  recycling and water reuse systems, founded in 2012 after acquiring the assets of the defunct
  Brac Systems. Its flagship Greyter HOME captured water from showers and bathtubs, treated it,
  and returned clear, odor-free water for toilet flushing, cutting a family home's indoor water
  consumption by up to 25 percent; it earned NSF/ANSI 350 Class R certification in early 2019 as
  the first compact residential greywater reuse system to hold that designation. A scaled
  commercial line served water harvesting and reuse for toilet flushing and cooling towers in
  multi-unit and institutional buildings, and the systems were installed in more than a dozen
  countries. The company raised roughly $13M through a Series B. Its only software was an
  end-user monitoring surface — the mygreyter.com portal and a consumer Greyter mobile app used
  by owners to watch water savings — and it never published a developer program, public API, SDK,
  webhooks, or any machine-readable specification. Greyter Water Systems Inc. filed for bankruptcy
  on January 8, 2026, with GlassRatner Restructuring Inc. appointed Trustee and its intellectual
  property, patents and customer lists placed into an asset sale process. This profile is retained
  as a historical record; there is no API surface to enrich.
